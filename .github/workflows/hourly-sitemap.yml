
name: Hourly Sitemap and Reindexing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitshift-daily-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify required files
        shell: bash
        run: |
          test -f urls.txt || {
            echo "ERROR: urls.txt is missing."
            exit 1
          }

          test -f public/_redirects || {
            echo "ERROR: public/_redirects is missing. Deployment stopped."
            exit 1
          }

      - name: Generate sitemap and preserve redirects
        run: node build-sitemap.js

      - name: Validate deployment output
        shell: bash
        run: |
          test -s public/sitemap.xml
          test -s public/_redirects
          test -s public/f415bd52dd47451c8a88078c77c9ae87.txt

          grep -q '<lastmod>' public/sitemap.xml
          grep -q '<changefreq>hourly</changefreq>' public/sitemap.xml

          echo "Sitemap and redirect validation passed."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=bitshift-daily --branch=main

      - name: Submit URLs to IndexNow
        if: success()
        run: node ping-indexnow.js
